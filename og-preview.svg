<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="bg-grad" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#141c30"/>
      <stop offset="60%" stop-color="#070a12"/>
      <stop offset="100%" stop-color="#030509"/>
    </radialGradient>
    <radialGradient id="sphere-glow" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#6366f1"/>
      <stop offset="80%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    <linearGradient id="neon-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Fondo espacial oscuro -->
  <rect width="1200" height="630" fill="url(#bg-grad)"/>

  <!-- Rejilla futurista de perspectiva (grid de fondo) -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="500" y1="0" x2="500" y2="630"/>
    <line x1="700" y1="0" x2="700" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1100" y1="0" x2="1100" y2="630"/>
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
  </g>

  <!-- Aura de luz central -->
  <circle cx="920" cy="315" r="260" fill="#6366f1" opacity="0.18" filter="url(#soft-glow)"/>
  <circle cx="920" cy="315" r="160" fill="#06b6d4" opacity="0.15" filter="url(#soft-glow)"/>

  <!-- Elemento 3D Esfera reflectante -->
  <circle cx="920" cy="315" r="140" fill="url(#sphere-glow)" filter="url(#card-shadow)"/>
  <ellipse cx="920" cy="315" rx="190" ry="70" fill="none" stroke="url(#neon-line)" stroke-width="5" transform="rotate(-28 920 315)"/>
  <ellipse cx="920" cy="315" rx="180" ry="60" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="10 12" transform="rotate(35 920 315)"/>

  <!-- Orbes y pelotas físicas flotando -->
  <circle cx="750" cy="180" r="32" fill="#ec4899" filter="url(#card-shadow)"/>
  <circle cx="1080" cy="450" r="24" fill="#10b981" filter="url(#card-shadow)"/>
  <circle cx="1050" cy="170" r="18" fill="#f59e0b" filter="url(#card-shadow)"/>

  <!-- Panel informativo tipo Glassmorphism a la izquierda -->
  <rect x="80" y="80" width="560" height="470" rx="24" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5" filter="url(#card-shadow)"/>

  <!-- Badge superior -->
  <rect x="120" y="125" width="220" height="34" rx="17" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1"/>
  <text x="230" y="147" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="1.5">REACT 19 + THREE.JS</text>

  <!-- Título principal -->
  <text x="120" y="225" font-family="'Outfit', sans-serif" font-size="52" font-weight="800" fill="#ffffff" letter-spacing="-1">NEXUS // 3D</text>

  <!-- Subtítulo -->
  <text x="120" y="270" font-family="'Inter', sans-serif" font-size="22" font-weight="600" fill="#38bdf8">Estudio de Materiales & Simulador Físico</text>

  <!-- Descripción breve -->
  <text x="120" y="325" font-family="'Inter', sans-serif" font-size="16" fill="#94a3b8">Librería de shaders procedimentales interactivos en tiempo real.</text>
  <text x="120" y="352" font-family="'Inter', sans-serif" font-size="16" fill="#94a3b8">Botonera 3D háptica con retroalimentación y simulación de gravedad.</text>

  <!-- Características clave en píldoras -->
  <g transform="translate(120, 395)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="145" height="36" rx="8" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)"/>
    <text x="72" y="23" font-family="'JetBrains Mono', monospace" font-size="12" fill="#e2e8f0" text-anchor="middle">⚡ WebGL r174</text>

    <!-- Pill 2 -->
    <rect x="155" y="0" width="155" height="36" rx="8" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)"/>
    <text x="232" y="23" font-family="'JetBrains Mono', monospace" font-size="12" fill="#e2e8f0" text-anchor="middle">🎯 Shaders PBR</text>

    <!-- Pill 3 -->
    <rect x="320" y="0" width="155" height="36" rx="8" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)"/>
    <text x="397" y="23" font-family="'JetBrains Mono', monospace" font-size="12" fill="#e2e8f0" text-anchor="middle">🔮 Físicas en Vivo</text>
  </g>

  <!-- Barra de pie con línea degradada de acento -->
  <rect x="120" y="475" width="480" height="3" rx="1.5" fill="url(#neon-line)"/>
</svg>
