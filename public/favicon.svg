<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="grad-core" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    <linearGradient id="grad-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fondo circular oscuro -->
  <circle cx="50" cy="50" r="48" fill="#090d16" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />

  <!-- Esfera central 3D degradada -->
  <circle cx="50" cy="50" r="28" fill="url(#grad-core)" filter="url(#glow)" />

  <!-- Anillos orbitales orbital 3D -->
  <ellipse cx="50" cy="50" rx="38" ry="16" fill="none" stroke="url(#grad-ring)" stroke-width="3" transform="rotate(-25 50 50)" />
  <ellipse cx="50" cy="50" rx="38" ry="16" fill="none" stroke="url(#grad-ring)" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.7" transform="rotate(35 50 50)" />

  <!-- Partículas de energía brillante -->
  <circle cx="28" cy="32" r="3" fill="#ffffff" filter="url(#glow)" />
  <circle cx="72" cy="65" r="2.5" fill="#38bdf8" />
  <circle cx="75" cy="35" r="2" fill="#ec4899" />
</svg>
