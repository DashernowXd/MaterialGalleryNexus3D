<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nexus 3D // Redireccionando...</title>
  <style>
    body {
      margin: 0;
      background: #07090e;
      color: #38bdf8;
      font-family: 'Inter', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(56, 189, 248, 0.2);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 1rem;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
  <script>
    // Recupera la ruta relativa y la transforma para HashRouter en GitHub Pages
    (function () {
      var currentPath = window.location.pathname;
      var repoName = currentPath.split('/')[1] || '';
      var subPath = currentPath.substring(repoName.length + 1);
      
      // Si la URL apunta a un subpath sin hash, redirige a /#/subpath
      if (subPath && subPath !== '/') {
        var cleanSub = subPath.startsWith('/') ? subPath : '/' + subPath;
        window.location.replace('/' + repoName + '/#' + cleanSub);
      } else {
        window.location.replace('/' + repoName + '/#/');
      }
    })();
  </script>
</head>
<body>
  <div class="spinner"></div>
  <p>Iniciando experiencia 3D en GitHub Pages...</p>
</body>
</html>
